[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finura"
version = "0.1.0"
description = "Source-traceable, evidence-first fundamental research for PSX equities."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["finura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The legacy `pipeline/` scripts are not packaged; expose the repository root
# so their tests do not depend on the working directory.
pythonpath = ["."]
